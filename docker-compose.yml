version: '3.8'
services:
  flask-app:
    build: .
    ports:
      - "5006:5006"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_USER: muralikrish
      POSTGRES_PASSWORD: Levika123
      POSTGRES_DB: ai_resume_dev
    ports:
      - "5432:5432"
  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
  celery-worker:
    build: .
    command: celery -A celery_worker.celery worker --loglevel=info
    depends_on:
      - redis
      - flask-app
